name: Publish NuGet Package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack and Publish NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore src/AvaloniaGauge/AvaloniaGauge.csproj

      - name: Build
        run: dotnet build src/AvaloniaGauge/AvaloniaGauge.csproj --no-restore --configuration Release

      - name: Pack
        run: dotnet pack src/AvaloniaGauge/AvaloniaGauge.csproj --no-build --configuration Release --output ./packages

      - name: Publish to NuGet
        run: dotnet nuget push "./packages/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate
